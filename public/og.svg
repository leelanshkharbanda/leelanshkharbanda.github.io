<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#d8d1c1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f6f2e7"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Top eyebrow -->
  <circle cx="88" cy="96" r="8" fill="#ff8567" stroke="#1d1e19" stroke-width="3"/>
  <text x="110" y="103" fill="#5c5a50" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="18" font-weight="600" letter-spacing="2">B.TECH ECE · IIIT DELHI</text>

  <!-- Main title with lime highlight -->
  <rect x="76" y="294" width="376" height="30" rx="15" fill="#dfff68"/>
  <g fill="#1d1e19" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-2">
    <text x="80" y="220" font-size="82">Hey, I’m</text>
    <text x="80" y="314" font-size="82">Leelansh.</text>
  </g>

  <!-- Clean subtitle -->
  <text x="82" y="392" fill="#5c5a50" font-family="Arial, Helvetica, sans-serif" font-size="28">Signal processing, computer architecture,</text>
  <text x="82" y="432" fill="#5c5a50" font-family="Arial, Helvetica, sans-serif" font-size="28">and software projects.</text>

  <!-- Bottom URL pill -->
  <rect x="80" y="492" width="368" height="50" rx="25" fill="#ffdc63" stroke="#1d1e19" stroke-width="3"/>
  <text x="110" y="524" fill="#1d1e19" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="18" font-weight="700">leelanshkharbanda.github.io</text>

  <!-- Right-side dark signal card matching the hero widget -->
  <rect x="772" y="138" width="346" height="360" rx="28" fill="#d9c9ff" stroke="#1d1e19" stroke-width="4" transform="rotate(3 945 318)"/>
  <rect x="748" y="122" width="356" height="366" rx="26" fill="#1d1e19" stroke="#1d1e19" stroke-width="4"/>
  <line x1="748" y1="176" x2="1104" y2="176" stroke="#606356" stroke-width="2"/>
  <text x="774" y="156" fill="#c7c9bc" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="14" letter-spacing="1">01 / CHANNEL SKETCH</text>
  <line x1="776" y1="398" x2="1076" y2="398" stroke="#f5f1e6" stroke-width="6"/>
  <line x1="776" y1="398" x2="1076" y2="398" stroke="#ff785a" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M 824 274 L 1034 252" fill="none" stroke="#dfff68" stroke-width="4"/>
  <path d="M 824 274 L 929 398 L 1034 252" fill="none" stroke="#ff785a" stroke-width="3" stroke-dasharray="8 6"/>
