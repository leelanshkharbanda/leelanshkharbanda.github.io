  <circle cx="1034" cy="252" r="16" fill="#ff785a" stroke="#1d1e19" stroke-width="3"/>
  <text x="824" y="314" text-anchor="middle" fill="#d8dbce" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13">TX</text>
  <text x="1034" y="292" text-anchor="middle" fill="#d8dbce" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="13">RX</text>
  <text x="776" y="454" fill="#dfff68" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="18" font-weight="700">DSP · ARCH · SYSTEMS</text>
